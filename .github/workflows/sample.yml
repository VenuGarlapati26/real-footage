# 8-SECOND SAMPLES WITH REAL FOOTAGE. By hand only (Actions -> Samples -> Run workflow): the channel is live, and running
# on every push (the autopilot pushes new episodes every day) would spend free minutes for nothing.
# Renders both formats capped at channel/settings.json -> dev.maxSeconds and keeps them as a downloadable artifact.
name: Samples (8 s, real footage)
on:
  workflow_dispatch:
    inputs:
      episode: { description: "Episode file", default: "episodes/E001-iss-16-sunrises.json" }
jobs:
  sample:
    runs-on: ubuntu-24.04   # pinned: "latest" moves to Ubuntu 26 and could break installs
    timeout-minutes: 60
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      KOKORO_MODEL: ${{ github.workspace }}/.cache/kokoro/kokoro-v1.0.int8.onnx
      KOKORO_VOICES: ${{ github.workspace }}/.cache/kokoro/voices-v1.0.bin
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift && df -h / | tail -1
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q kokoro-onnx soundfile && npm ci && npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with: { path: .cache/kokoro, key: "kokoro-v1" }   # only the voice model: a footage cache grew to 6 GB and filled the disk
      - name: Kokoro fallback voice
        run: |
          mkdir -p .cache/kokoro && cd .cache/kokoro
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do [ -f $f ] || curl -sSLf -o $f "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"; done
      - run: npm test
      - name: Gates
        run: npx tsx engine/gates.ts ${{ inputs.episode || 'episodes/E001-iss-16-sunrises.json' }}
      - name: Render 8-second samples (both formats)
        run: npx tsx engine/build.ts ${{ inputs.episode || 'episodes/E001-iss-16-sunrises.json' }} --formats long,short --preview   # always a short preview, even after going live
      - uses: actions/upload-artifact@v4
        with: { name: "samples-${{ github.run_id }}", path: "out/**/*-dev.*", retention-days: 7 }
