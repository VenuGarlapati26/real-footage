<!doctype html>
<html><head><meta charset="utf-8">
<!-- LUMORA final brand: the Glow Orb mark + banner. Laid out at YouTube's sizes (banner 2560x1440, profile 800x800)
     and rendered at 4K by tools/lumora-brand.ts (deviceScaleFactor), so type and shapes are drawn natively sharp.
     Photos: real NASA frames (public domain) in channel/art/frames. -->
<style>
  @font-face { font-family: Inter; src: url(../assets/fonts/Inter.ttf); font-weight: 100 900; }
  @font-face { font-family: Mono; src: url(../assets/fonts/JetBrainsMono.ttf); font-weight: 100 800; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #fff; }
  .art { position: relative; overflow: hidden; }
  .abs { position: absolute; }

  /* ---- the mark: a luminous orb (aurora greens, teal, violet, gold) with real aurora texture and a white L ---- */
  .mark { position: absolute; border-radius: 50%; }
  .mark .orb, .mark .tex, .mark .gloss { position: absolute; inset: 0; border-radius: 50%; }
  .mark .orb { background:
      radial-gradient(circle at 70% 75%, #6A3CFF 0%, rgba(106,60,255,0) 45%),
      radial-gradient(circle at 25% 70%, #10C98F 0%, rgba(16,201,143,0) 50%),
      radial-gradient(circle at 75% 30%, #FFC94A 0%, rgba(255,201,74,0) 45%),
      radial-gradient(circle at 50% 50%, #0FA3B1 0%, #0B3D3A 80%); }
  .mark .tex { background: url(../channel/art/frames/aurora.jpg) no-repeat; background-size: 315% auto; background-position: 47% 62%; mix-blend-mode: screen; opacity: .5; }
  .mark .gloss { background: radial-gradient(ellipse 34% 22% at 34% 20%, rgba(255,255,255,.8) 0%, rgba(255,255,255,0) 100%),
                             radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,25,22,.28) 100%); }
  .mark .L { position: absolute; left: 0; right: 0; text-align: center; font-family: Inter; font-weight: 800; letter-spacing: -.06em; color: #fff;
    text-shadow: 0 .02em .08em rgba(0,0,0,.25); }

  /* ---- profile 800x800 ---- */
  #profile { width: 800px; height: 800px; background: radial-gradient(circle at 50% 46%, #FFFFFF 0%, #F6F8F6 70%, #EEF3F1 100%); }
  #profile .mark { left: 80px; top: 80px; width: 640px; height: 640px; }
  #profile .mark .name { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #profile .mark .name .w { font: 800 148px/1 Inter; letter-spacing: -.055em; color: #fff; text-shadow: 0 4px 24px rgba(0,30,25,.35); margin-top: -8px; }
  #profile .mark .name .u { width: 120px; height: 7px; border-radius: 4px; background: #FFE29A; margin-top: 26px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }

  /* ---- banner 2560x1440 (text inside the safe area x 507-2053, y 508-931) ---- */
  #banner { width: 2560px; height: 1440px; background:
      radial-gradient(ellipse 50% 60% at 80% 50%, #E6F5EF 0%, rgba(230,245,239,0) 70%),
      radial-gradient(ellipse 40% 50% at 18% 40%, #FFF3DC 0%, rgba(255,243,220,0) 70%),
      radial-gradient(ellipse 35% 40% at 60% 95%, #EEE9FF 0%, rgba(238,233,255,0) 70%), #FCFCFA; }
  #banner .mark { left: 560px; top: 588px; width: 250px; height: 250px; box-shadow: 0 30px 60px -16px rgba(16,90,80,.45); }
  #banner .mark .L { top: 26px; font-size: 200px; line-height: 1; }
  .word { font: 800 190px/1 Inter; letter-spacing: -.055em;
    background: linear-gradient(100deg, #0E1A17 0%, #0E1A17 55%, #13896A 100%); -webkit-background-clip: text; color: transparent; }
  .tag { font: 500 46px/1.15 Inter; color: #2E3A36; letter-spacing: -.01em; margin-top: 6px; }
  .tag b { font-weight: 700; color: #13896A; }
  .sched { font: 600 23px/1 Mono; letter-spacing: .16em; color: #77736b; text-transform: uppercase; white-space: nowrap; margin-top: 26px; }
  .card { position: absolute; border-radius: 28px; background-size: cover; background-position: center;
    box-shadow: 0 40px 70px -20px rgba(15,30,25,.35), 0 0 0 6px #fff; }
</style></head>
<body>
  <div id="banner" class="art">
    <div class="card" style="left:1760px; top:340px; width:560px; height:340px; transform: rotate(-7deg); background-image:url(../channel/art/frames/sunrise.jpg); background-position:56% 47%"></div>
    <div class="card" style="left:2150px; top:520px; width:520px; height:300px; transform: rotate(6deg); background-image:url(../channel/art/frames/citylights.jpg)"></div>
    <div class="card" style="left:1820px; top:720px; width:600px; height:360px; transform: rotate(-2deg); background-image:url(../channel/art/frames/aurora.jpg)"></div>
    <div class="card" style="left:2240px; top:230px; width:420px; height:250px; transform: rotate(-4deg); background-image:url(../channel/art/frames/peak.jpg)"></div>
    <div class="mark"><div class="orb"></div><div class="tex"></div><div class="gloss"></div><div class="L">L</div></div>
    <div class="abs" style="left:850px; top:548px;">
      <div class="word">lumora</div>
      <div class="tag">Real footage. <b>Unreal stories.</b></div>
      <div class="sched">New Shorts daily · Films Mon · Wed · Fri · Sun</div>
    </div>
  </div>
  <div id="profile" class="art">
    <div class="mark"><div class="orb"></div><div class="tex"></div><div class="gloss"></div><div class="name"><div class="w">lumora</div><div class="u"></div></div></div>
  </div>
  <script>
    const urls = ["aurora", "citylights", "sunrise", "peak"].map(n => `../channel/art/frames/${n}.jpg`);
    Promise.all([document.fonts.ready, ...urls.map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; }))]).then(() => { window.ready = true; });
  </script>
</body></html>
